name: Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p android :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AutoRadio-Connect-V2-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish Android APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk AutoRadio-Connect.apk
          tag="android-build-${GITHUB_RUN_ID}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" AutoRadio-Connect.apk --clobber
          else
            gh release create "$tag" AutoRadio-Connect.apk --target "$GITHUB_SHA" --title "AutoRadio Connect V2 Alpha - build ${GITHUB_RUN_NUMBER}" --notes "APK de diagnóstico Android. Versão de testes, sem comandos de reset ou firmware." --latest
          fi
